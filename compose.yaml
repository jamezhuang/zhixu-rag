services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zhixu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhixu_local_only}
      POSTGRES_DB: zhixu
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:${POSTGRES_PORT:-55432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhixu -d zhixu"]
      interval: 5s
      timeout: 5s
      retries: 20
  milvus:
    image: milvusdb/milvus:v2.6.4
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    ports: ["127.0.0.1:${MILVUS_PORT:-19531}:19530", "127.0.0.1:${MILVUS_HTTP_PORT:-19091}:9091"]
    volumes:
      - milvus_data:/var/lib/milvus
      - ./infra/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      APP_MODE: live
      DATABASE_URL: postgresql+psycopg://zhixu:${POSTGRES_PASSWORD:-zhixu_local_only}@postgres:5432/zhixu
      MILVUS_URI: http://milvus:19530
    volumes: ["./data:/workspace/data"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      milvus: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
  frontend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      backend: { condition: service_healthy }
volumes:
  postgres_data:
  milvus_data:
