server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 11m;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 600s;
        proxy_connect_timeout 15s;
        proxy_set_header Host $host;
    }
    location / { try_files $uri $uri/ /index.html; }
}
